name: Render burst lines
# 集中線のエフェクトのコンパイルと描画を、各 OS の描画方式で確かめる。
# - Windows: D3D11。GPU の無いランナーでは DXGI のソフトウェアのアダプター (WARP) で描く
# - Ubuntu: Mesa の OpenGL
# - macOS: OpenGL
# 開発者は macOS と Linux の機材を持たないため、この 2 つの OS の描画はこのワークフローで検証する。
# burst-lines-integration-test は検査に外れると終了コード 1 を返す。burst-lines-benchmark は GPU 時間を記録するだけで、合否には使わない
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'CMakeLists.txt'
      - 'src/**'
      - 'data/**'
      - 'tests/**'
      - '.github/workflows/render-test.yaml'
permissions:
  contents: read
env:
  SCENARIOS: empty-center empty-center-shape color opacity settings-update animation custom-size
  BENCH_LINE_COUNTS: 120 400
jobs:
  windows-render:
    name: Render on Windows (D3D11)
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build plugin and render tests
        uses: ./.github/actions/build-plugin
        with:
          target: x64
          config: RelWithDebInfo

      - name: Build D3D11 module
        run: cmake --build .deps/obs-studio-31.1.1/build_x64 --config Release --target libobs-d3d11

      - name: List graphics adapters
        run: Get-CimInstance Win32_VideoController | Select-Object Name, DriverVersion | Format-Table -AutoSize

      - name: Render burst lines
        run: |
          ctest --test-dir build_x64 -C RelWithDebInfo -R d3d11 --output-on-failure 2>&1 | Tee-Object -FilePath render-windows.log
          $failed = $LASTEXITCODE
          $env:PATH = "$PWD\.deps\bin\64bit;$PWD\.deps\obs-deps-2025-07-11-x64\bin;$env:PATH"
          # LoadLibrary は相対パスのプラグインを読み込めないため、絶対パスで渡す
          & "$PWD\build_x64\RelWithDebInfo\burst-lines-benchmark.exe" "$PWD\build_x64\RelWithDebInfo\simple-burst-lines.dll" `
            "$PWD\data" "$PWD\.deps\obs-studio-31.1.1\build_x64\libobs-d3d11\Release\libobs-d3d11.dll" `
            "$PWD\.deps\obs-studio-31.1.1\libobs\data" $env:BENCH_LINE_COUNTS.Split(' ') 2>&1 |
            Tee-Object -FilePath render-windows.log -Append
          exit $failed

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-windows
          path: render-windows.log
          if-no-files-found: warn

  ubuntu-render:
    name: Render on Ubuntu (Mesa OpenGL)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: x86_64
          config: RelWithDebInfo

      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgl1-mesa-dri libegl-mesa0 libx11-dev

      - name: Build render tests
        run: |
          cmake -S . -B build_x86_64 -DENABLE_RENDER_TESTS=ON
          cmake --build build_x86_64 --config RelWithDebInfo --target burst-lines-integration-test burst-lines-benchmark

      - name: Render burst lines
        run: |
          set -o pipefail
          plugin=$(find "$PWD/build_x86_64" -name 'simple-burst-lines.so' -print -quit)
          integration=$(find "$PWD/build_x86_64" -name 'burst-lines-integration-test' -type f -print -quit)
          bench=$(find "$PWD/build_x86_64" -name 'burst-lines-benchmark' -type f -print -quit)
          gl=$(find /usr/lib -name 'libobs-opengl.so*' -print -quit)
          echo "plugin=${plugin} integration=${integration} bench=${bench} gl=${gl}"
          failed=0
          for scenario in ${SCENARIOS}; do
            if xvfb-run -a -s '-screen 0 1280x720x24' "${integration}" "${plugin}" "$PWD/data" "${gl}" \
              /usr/share/obs/libobs "${scenario}" >> render-ubuntu.log 2>&1; then
              echo "PASS ${scenario}" | tee -a render-ubuntu.log
            else
              echo "FAIL ${scenario}" | tee -a render-ubuntu.log
              failed=1
            fi
          done
          xvfb-run -a -s '-screen 0 1280x720x24' "${bench}" "${plugin}" "$PWD/data" "${gl}" /usr/share/obs/libobs \
            ${BENCH_LINE_COUNTS} 2>&1 | tee -a render-ubuntu.log || true
          exit ${failed}

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-ubuntu
          path: render-ubuntu.log
          if-no-files-found: warn

  macos-render:
    name: Render on macOS (OpenGL)
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        shell: zsh --no-rcs --errexit --pipefail {0}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode_16.1.0.app/Contents/Developer

      - name: Build plugin
        uses: ./.github/actions/build-plugin
        with:
          target: macos-universal
          config: RelWithDebInfo

      - name: Build render tests and OpenGL module
        run: |
          cmake -S . -B build_macos -DENABLE_RENDER_TESTS=ON
          cmake --build build_macos --config RelWithDebInfo --target burst-lines-integration-test burst-lines-benchmark
          cmake --build .deps/obs-studio-31.1.1/build_universal --config Release --target libobs-opengl

      - name: Render burst lines
        run: |
          plugin=$(find "$PWD/build_macos" -path '*RelWithDebInfo/simple-burst-lines.plugin/Contents/MacOS/simple-burst-lines' -print -quit)
          integration=$(find "$PWD/build_macos" -name 'burst-lines-integration-test' -type f -perm -u+x -print -quit)
          bench=$(find "$PWD/build_macos" -name 'burst-lines-benchmark' -type f -perm -u+x -print -quit)
          gl=$(find "$PWD/.deps/obs-studio-31.1.1/build_universal" \( -name 'libobs-opengl.dylib' -o -name 'libobs-opengl.so' \) -print -quit)
          print "plugin=${plugin} integration=${integration} bench=${bench} gl=${gl}"
          # 実行ファイルと libobs-opengl は @rpath の libobs.framework を参照する。ビルド時の framework は .deps/Frameworks、
          # libobs が参照する FFmpeg などの dylib は .deps の obs-deps にある
          deps_lib=$(dirname "$(find "$PWD/.deps" -name 'libavcodec.dylib' -print -quit)")
          print "deps_lib=${deps_lib}"
          export DYLD_FRAMEWORK_PATH="$PWD/.deps/Frameworks"
          export DYLD_LIBRARY_PATH="${deps_lib}"
          core="$PWD/.deps/obs-studio-31.1.1/libobs/data"
          failed=0
          for scenario in ${=SCENARIOS}; do
            if "${integration}" "${plugin}" "$PWD/data" "${gl}" "${core}" "${scenario}" >> render-macos.log 2>&1; then
              print "PASS ${scenario}" | tee -a render-macos.log
            else
              print "FAIL ${scenario}" | tee -a render-macos.log
              failed=1
            fi
          done
          "${bench}" "${plugin}" "$PWD/data" "${gl}" "${core}" ${=BENCH_LINE_COUNTS} 2>&1 | tee -a render-macos.log || true
          exit ${failed}

      - name: Upload render log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: render-macos
          path: render-macos.log
          if-no-files-found: warn
